name: Runner testen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, g6-deploy, x64]
    steps:
      - name: Controleer gebruiker en Docker
        run: |
          whoami
          docker info --format '{{.ServerVersion}}'
          docker compose version
